name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --verbose

      - name: Install Tauri CLI and UI dependencies
        shell: cmd
        run: |
          cd crates\wristkey-ui
          npm install

      - name: Build Production Tauri App and NSIS Installer
        shell: cmd
        run: |
          cd crates\wristkey-ui
          npx @tauri-apps/cli build --bundles nsis

      - name: Build Developer Tools (CLI & Credential Provider DLL)
        run: |
          cargo build --release -p wristkey-cli -p wristkey-credprov

      - name: Upload Developer Artifacts (CI Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: wristkey-developer-tools
          path: |
            target/release/wristkey-cli.exe
            target/release/wristkey_credprov.dll

      - name: Publish GitHub Release (Installer Only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: WristKey ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
